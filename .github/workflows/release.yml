name: immutable release evidence

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Build and create immutable evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "${GITHUB_REF_NAME}" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "unsupported release tag: ${GITHUB_REF_NAME}"; exit 1 ;;
          esac
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release already exists; refusing to replace immutable release"
            exit 1
          fi
          tag_ref=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}")
          tag_object=$(printf '%s' "${tag_ref}" | jq -r '.object.sha')
          tag_type=$(printf '%s' "${tag_ref}" | jq -r '.object.type')
          test "${tag_type}" = "tag"
          tag_target=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" --jq '.object.sha')
          test "${tag_target}" = "${GITHUB_SHA}"
          # Immutable releases are enabled once by the repository owner via
          # the Administration REST API. GITHUB_TOKEN cannot read that admin
          # setting; the release API assertion below is the authoritative CI
          # check for the published result.
          go build ./...
          go test ./...
          go vet ./...
          evidence_dir="${RUNNER_TEMP}/gooo-meta-operator-typechecker-release"
          go run ./cmd/gooo-meta-operator-typechecker conformance \
            -root . -fixtures fixtures/compiler -output-dir "${evidence_dir}/conformance" \
            -tests-total 7 -tests-selected 7 -tests-executed 7 \
            -tests-reused 0 -tests-failed 0 -tests-unknown 0
          printf 'release_tag=%s\ntarget_commit=%s\ntag_object=%s\n' \
            "${GITHUB_REF_NAME}" "${GITHUB_SHA}" "${tag_object}" > "${evidence_dir}/release-metadata.txt"
          tar -C "${evidence_dir}" -czf "${RUNNER_TEMP}/evidence-${GITHUB_REF_NAME}.tar.gz" .
          sha256sum "${RUNNER_TEMP}/evidence-${GITHUB_REF_NAME}.tar.gz" > "${RUNNER_TEMP}/evidence-${GITHUB_REF_NAME}.tar.gz.sha256"
          gh release create "${GITHUB_REF_NAME}" --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes "Immutable conformance evidence for ${GITHUB_SHA}." \
            "${RUNNER_TEMP}/evidence-${GITHUB_REF_NAME}.tar.gz" \
            "${RUNNER_TEMP}/evidence-${GITHUB_REF_NAME}.tar.gz.sha256"
          immutable=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq '.immutable')
          test "${immutable}" = "true"
